<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AICS Verification</title>
  <style>
    :root {
      --navy: #0B2559;
      --blue: #163E8C;
      --gold: #D4AF37;
      --gold-dark: #B59122;
      --gold-light: #FFFBEB;
      --bg: #F3F6FB;
      --card: #FFFFFF;
      --border: #D9E1EE;
      --text: #1E293B;
      --muted: #64748B;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }

    .top-banner {
      background: linear-gradient(135deg, var(--navy), var(--blue));
      color: #FFFFFF;
      border-bottom: 5px solid var(--gold);
      padding: 18px 24px;
      box-shadow: 0 3px 10px rgba(11, 37, 89, 0.18);
    }

    .banner-inner {
      max-width: 980px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .logo-slot {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 3px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .logo-slot img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 4px;
      display: none;
    }

    .title-block {
      text-align: center;
      flex: 1;
    }

    .title-block h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: 0.6px;
      color: #FFFFFF;
    }

    .title-block p {
      margin: 5px 0 0;
      font-size: 13px;
      color: #FDE68A;
      font-weight: 500;
    }

    .container {
      max-width: 980px;
      margin: 28px auto;
      padding: 0 20px;
    }

    .search-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(11, 37, 89, 0.06);
      margin-bottom: 22px;
    }

    .search-panel input {
      flex: 1;
      padding: 12px 15px;
      font-size: 15px;
      border: 1.5px solid #CBD5E1;
      border-radius: 7px;
      outline: none;
    }

    .search-panel input:focus {
      border-color: var(--blue);
    }

    .btn-primary {
      background-color: var(--navy);
      color: #FFFFFF;
      border: 2px solid var(--gold);
      border-radius: 7px;
      padding: 0 24px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary:hover {
      background-color: var(--blue);
    }

    .summary-bar {
      font-size: 14px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 14px;
    }

    .record-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 6px solid var(--navy);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 2px 6px rgba(11, 37, 89, 0.05);
    }

    .record-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .record-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--navy);
    }

    .row-pill {
      background: #EFF6FF;
      color: var(--navy);
      border: 1px solid #BFDBFE;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px 18px;
      margin-bottom: 18px;
    }

    .info-box label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .info-box div {
      font-size: 14px;
      color: var(--text);
      font-weight: 500;
    }

    .edit-bar {
      background: var(--gold-light);
      border: 1px solid #FDE68A;
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .edit-bar label {
      font-weight: 700;
      color: var(--navy);
      font-size: 14px;
    }

    .status-field {
      padding: 8px 12px;
      font-size: 14px;
      font-weight: 600;
      border: 1.5px solid var(--gold);
      border-radius: 6px;
      background: #FFFFFF;
      min-width: 200px;
      color: var(--text);
    }

    .btn-gold {
      background-color: var(--gold);
      color: var(--navy);
      border: none;
      border-radius: 6px;
      padding: 9px 18px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-gold:hover {
      background-color: var(--gold-dark);
      color: #FFFFFF;
    }

    .feedback {
      font-size: 13px;
      font-weight: 700;
    }

    .state-msg {
      text-align: center;
      padding: 32px;
      color: var(--muted);
      font-size: 15px;
    }
  </style>
</head>
<body>

  <header class="top-banner">
    <div class="banner-inner">
      <div class="logo-slot">
        <img id="logoLeft" alt="PSWD Logo">
      </div>
      <div class="title-block">
        <h1>AICS Verification</h1>
        <p>Beneficiary Search &amp; Status Update Portal</p>
      </div>
      <div class="logo-slot">
        <img id="logoRight" alt="Province of Sorsogon Seal">
      </div>
    </div>
  </header>

  <main class="container">
    <div class="search-panel">
      <input
        type="text"
        id="searchInput"
        placeholder="Search by Last Name, First Name, or Middle Name..."
        onkeydown="if (event.key === 'Enter') runSearch()"
      >
      <button class="btn-primary" onclick="runSearch()">Search</button>
    </div>

    <div id="resultsArea"></div>
  </main>

  <datalist id="statusChoices">
    <option value="Verified">
    <option value="Pending">
    <option value="Approved">
    <option value="For Release">
    <option value="Released">
    <option value="Disqualified">
  </datalist>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyWLQ7dbQrdwLI_JiU4YHvajFEEYVzflrhLyLTb4gDbBoILB0IWRXakYZqebd7XjD87/exec";

    window.addEventListener("DOMContentLoaded", async function () {
      if (!API_URL || API_URL.includes("REPLACE_WITH_")) return;
      try {
        const res = await fetch(`${API_URL}?action=logos`);
        const data = await res.json();
        if (data.ok && data.logos) {
          if (data.logos.pswd) {
            const left = document.getElementById("logoLeft");
            left.src = data.logos.pswd;
            left.style.display = "block";
          }
          if (data.logos.seal) {
            const right = document.getElementById("logoRight");
            right.src = data.logos.seal;
            right.style.display = "block";
          }
        }
      } catch (err) {
        console.error("Failed to load logos:", err);
      }
    });

    async function runSearch() {
      const query = document.getElementById("searchInput").value.trim();
      const area = document.getElementById("resultsArea");

      if (!query) {
        area.innerHTML = '<div class="state-msg">Enter a beneficiary name to search.</div>';
        return;
      }

      area.innerHTML = '<div class="state-msg">Searching Google Sheet...</div>';

      try {
        const res = await fetch(`${API_URL}?action=search&q=${encodeURIComponent(query)}`);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "Search failed");
        renderRecords(data.records || []);
      } catch (err) {
        area.innerHTML = `<div class="state-msg" style="color:#B91C1C;">Error: ${escapeHtml(err.message)}</div>`;
      }
    }

    function renderRecords(records) {
      const area = document.getElementById("resultsArea");
      area.innerHTML = "";

      if (!records.length) {
        area.innerHTML = '<div class="state-msg">No matching records found.</div>';
        return;
      }

      const summary = document.createElement("div");
      summary.className = "summary-bar";
      summary.textContent = `Showing ${records.length} matching record(s)`;
      area.appendChild(summary);

      records.forEach(function (rec) {
        const lastName = rec.fields[0] ? rec.fields[0].value : "";
        const firstName = rec.fields[1] ? rec.fields[1].value : "";
        const middleName = rec.fields[2] ? rec.fields[2].value : "";
        const displayName = `${lastName}, ${firstName} ${middleName}`.replace(/^,\s*|\s+$/g, "") || "Beneficiary Record";

        const detailsHtml = rec.fields.slice(3).map(function (f) {
          return `
            <div class="info-box">
              <label>${escapeHtml(f.label)}</label>
              <div>${escapeHtml(f.value) || "—"}</div>
            </div>
          `;
        }).join("");

        const card = document.createElement("div");
        card.className = "record-card";
        card.innerHTML = `
          <div class="record-header">
            <div class="record-title">${escapeHtml(displayName)}</div>
            <span class="row-pill">Row ${rec.rowNumber}</span>
          </div>
          <div class="info-grid">${detailsHtml}</div>
          <div class="edit-bar">
            <label for="status-${rec.rowNumber}">${escapeHtml(rec.statusLabel)}:</label>
            <input
              type="text"
              list="statusChoices"
              class="status-field"
              id="status-${rec.rowNumber}"
              value="${escapeHtml(rec.status)}"
            >
            <button class="btn-gold" onclick="saveRowStatus(${rec.rowNumber}, ${rec.statusColIndex})">
              Save Status
            </button>
            <span class="feedback" id="msg-${rec.rowNumber}"></span>
          </div>
        `;
        area.appendChild(card);
      });
    }

    async function saveRowStatus(rowNumber, colIndex) {
      const inputEl = document.getElementById(`status-${rowNumber}`);
      const msgEl = document.getElementById(`msg-${rowNumber}`);
      const newVal = inputEl.value;

      msgEl.style.color = "#0B2559";
      msgEl.textContent = "Saving...";

      try {
        // text/plain avoids CORS preflight issues when calling Google Apps Script from external domains
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            rowNumber: rowNumber,
            status: newVal,
            colIndex: colIndex
          })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "Save failed");

        msgEl.style.color = "#15803D";
        msgEl.textContent = "✓ " + data.message;
        setTimeout(function () { msgEl.textContent = ""; }, 3000);
      } catch (err) {
        msgEl.style.color = "#B91C1C";
        msgEl.textContent = "Save failed: " + err.message;
      }
    }

    function escapeHtml(val) {
      if (val === null || val === undefined) return "";
      return String(val)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
